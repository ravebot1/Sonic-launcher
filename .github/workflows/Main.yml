{
  "name": "Build APK",
  "on": ["push", "workflow_dispatch"],
  "permissions": {"contents": "write"},
  "jobs": {
    "build": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {"uses": "actions/checkout@v4"},
        {"name": "Build number", "run": "echo \"BUILD=$((${{ github.run_number }} + 100))\" >> $GITHUB_ENV"},
        {"name": "Unzip project", "run": "unzip -q streamer-home.zip -d project"},
        {"name": "Restore signing key", "run": "if [ -f debug.keystore ]; then cp debug.keystore project/app/debug.keystore; fi; test -f project/app/debug.keystore"},
        {"uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": "17"}},
        {"uses": "gradle/actions/setup-gradle@v4", "with": {"gradle-version": "8.9"}},
        {"name": "Build", "working-directory": "project", "run": "gradle assembleDebug --no-daemon --stacktrace -PbuildNumber=${{ env.BUILD }}"},
        {"name": "Rename APK", "run": "cp project/app/build/outputs/apk/debug/app-debug.apk streamer-home.apk"},
        {"uses": "softprops/action-gh-release@v2", "with": {"tag_name": "build-${{ env.BUILD }}", "name": "Build ${{ env.BUILD }}", "files": "streamer-home.apk", "make_latest": "true"}}
      ]
    }
  }
}
