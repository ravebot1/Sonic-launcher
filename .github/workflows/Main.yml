{
  "name": "Build APK",
  "on": ["push", "workflow_dispatch"],
  "permissions": {"contents": "write"},
  "jobs": {
    "build": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {"uses": "actions/checkout@v4"},
        {"name": "Unzip project", "run": "ZIP=$(git show --diff-filter=AM --name-only --format= HEAD | grep -i '\\.zip$' | head -1); if [ -z \"$ZIP\" ] || [ ! -f \"$ZIP\" ]; then ZIP=streamer-home.zip; fi; echo \"Using zip: $ZIP\"; unzip -q \"$ZIP\" -d project; grep -n 'versionName' project/app/build.gradle.kts"},
        {"name": "Restore signing key", "run": "if [ -f debug.keystore ]; then cp debug.keystore project/app/debug.keystore; fi; test -f project/app/debug.keystore"},
        {"uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": "17"}},
        {"uses": "gradle/actions/setup-gradle@v4", "with": {"gradle-version": "8.9"}},
        {"name": "Build", "working-directory": "project", "run": "gradle assembleDebug --no-daemon --stacktrace -PbuildNumber=${{ github.run_number }}"},
        {"name": "Rename APK", "run": "cp project/app/build/outputs/apk/debug/app-debug.apk streamer-home.apk"},
        {"uses": "softprops/action-gh-release@v2", "with": {"tag_name": "build-${{ github.run_number }}", "name": "Build ${{ github.run_number }}", "files": "streamer-home.apk", "make_latest": "true"}}
      ]
    }
  }
}
